name: CI

on:
  push:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CI: true
  # Local Supabase instance started below. The keys are read from
  # `supabase status` at runtime so nothing secret-shaped lives in the repo.
  DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
  DATABASE_POOLER_URL: postgresql://postgres.pooler-dev:postgres@127.0.0.1:54329/postgres
  NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
  NEXT_PUBLIC_SITE_URL: http://localhost:3000
  MAILPIT_URL: http://127.0.0.1:54324

jobs:
  ci:
    name: typecheck, lint, format, unit, db, e2e, restore drill
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Generated types are up to date
        run: |
          npm run db:generate-types
          git diff --exit-code -- src/db/types.ts

      - name: Unit tests (Vitest)
        run: npm test

      - name: Start local Supabase
        run: |
          npm run db:start
          npx supabase status -o env \
            | sed -n 's/^PUBLISHABLE_KEY=/NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=/p; s/^SECRET_KEY=/SUPABASE_SECRET_KEY=/p' \
            | tr -d '"' >> "$GITHUB_ENV"

      - name: Migrate and seed
        run: |
          npm run db:migrate
          npm run db:seed

      - name: Database invariant and RLS tests
        run: npm run test:db

      - name: Resolve Playwright version
        run: echo "PLAYWRIGHT_VERSION=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_ENV"

      - name: Cache Playwright browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ env.PLAYWRIGHT_VERSION }}

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: End-to-end tests (Playwright)
        run: npm run test:e2e

      - name: Backup restore drill (H35)
        run: npm run db:backup-drill

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
